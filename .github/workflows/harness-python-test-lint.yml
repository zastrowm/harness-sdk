name: "Harness Python: Test and Lint"

# Lint + unit tests for the harness-py library (`strands-harness`). Reusable:
# called by ci.yml on PRs that touch harness-py, and by release-harness-python.yml
# at release time. Mirrors python-test-lint.yml (the SDK's), but harness-py's dev
# workflow is pip + ruff + pytest rather than hatch.

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  unit-test:
    name: Unit Tests - Python ${{ matrix.python-version }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 20
    defaults:
      run:
        working-directory: harness-py
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install --no-cache-dir -e '.[dev]'
      - name: Run unit tests
        run: pytest

  lint:
    name: Lint
    runs-on: strands-agents_ubuntu-latest_4-core
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: harness-py
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install package + dev deps
        run: pip install --no-cache-dir -e '.[dev]'
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
